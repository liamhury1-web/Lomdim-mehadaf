name: unzip-app
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack the app files from the zip
        run: |
          if [ ! -f lomdim-mehadaf.zip ]; then echo "nothing to unpack"; exit 0; fi
          mkdir -p /tmp/u && unzip -q -o lomdim-mehadaf.zip -d /tmp/u
          src=$(dirname "$(find /tmp/u -name index.html | head -1)")
          rm -rf "$src/api"
          cp -r "$src"/. .
          git rm -q lomdim-mehadaf.zip
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Unpack app files"
          git push
