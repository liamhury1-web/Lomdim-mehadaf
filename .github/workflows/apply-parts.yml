name: apply-parts
on: push
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply an update sent in parts
        run: |
          first=$(ls upd-*-of-*.txt 2>/dev/null | head -1)
          if [ -z "$first" ]; then echo "no update"; exit 0; fi
          n=$(echo "$first" | sed 's/.*-of-\([0-9]*\)\.txt/\1/')
          have=$(ls upd-*-of-*.txt | wc -l)
          if [ "$have" -lt "$n" ]; then echo "waiting $have/$n"; exit 0; fi
          mkdir -p /tmp/p && cat $(ls upd-*-of-*.txt | sort -V) | tr -d ' \r\n' | base64 -d | xz -d | tar x -C /tmp/p
          for f in /tmp/p/*.patch; do git apply --unidiff-zero "$f"; rm "$f"; done
          cp -r /tmp/p/. .
          git rm -q upd-*-of-*.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Apply update"
          git push
