<body>
<div id="app" class="wrap"><p class="muted">טוען…</p></div>
<div id="toast" class="toast" hidden></div>
<!-- file pickers live outside the views so the buttons can open them reliably on every phone -->
<input id="pickCam" class="vh" type="file" accept="image/*" capture="environment" tabindex="-1" aria-hidden="true">
<input id="pickGal" class="vh" type="file" accept="image/*" multiple tabindex="-1" aria-hidden="true">
